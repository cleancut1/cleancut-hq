<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b91c1c"><title>CleanCut HQ</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#18202d;background:#f5f6f9}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:850;font-size:21px;letter-spacing:-.8px}.brand span{color:#be123c}.tag{font-size:11px;background:#fff0f2;color:#a21d3b;padding:5px 8px;border-radius:30px}.shell{display:flex;min-height:calc(100vh - 65px)}aside{width:215px;background:white;border-right:1px solid #e7e9ef;padding:20px 12px;flex-shrink:0}aside button{display:block;width:100%;padding:13px;text-align:left;border-radius:11px;background:none;color:#596273;margin-bottom:5px}aside button.active{background:#fff0f2;color:#b91c1c;font-weight:700}main{padding:30px;max-width:1150px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:27px;margin:0 0 8px;letter-spacing:-1px}h2{font-size:18px;margin:0 0 16px}p{color:#687383;margin:4px 0 20px}.btn{background:#b91c1c;color:#fff;border-radius:10px;padding:11px 16px;font-weight:650}.btn.secondary{background:#f1f2f5;color:#283242}.btn.outline{background:white;border:1px solid #ddd;color:#333}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:23px 0}.card,.panel{background:#fff;border:1px solid #e8e9ee;border-radius:15px;padding:20px}.metric{font-size:30px;font-weight:800;margin:8px 0}.muted{color:#7b8594;font-size:13px}.panel{margin-top:18px}.item{border-top:1px solid #eff0f4;padding:15px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.item:first-of-type{border-top:0}.pill{font-size:12px;background:#f1f3f6;border-radius:30px;padding:5px 10px;color:#465365}.pill.good{background:#e7f7ef;color:#127044}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}label{font-size:13px;font-weight:650;display:block;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #dce0e7;border-radius:9px;background:#fff;color:#1f2937}textarea{min-height:85px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}.hidden{display:none!important}dialog{border:0;border-radius:18px;padding:25px;width:min(94vw,570px);box-shadow:0 20px 80px #18202d40}dialog::backdrop{background:#141b2a88}.dialoghead{display:flex;justify-content:space-between;align-items:center}.empty{padding:35px;text-align:center;color:#8a94a4;border:1px dashed #d7dce4;border-radius:12px}.doc{background:#fff;border:1px solid #ddd;padding:30px;margin:15px 0;box-shadow:0 4px 14px #00000008}.doc h2{font-size:28px;color:var(--accent,#b91c1c)}.doc table{width:100%;border-collapse:collapse;margin-top:22px}.doc th,.doc td{padding:10px;border-bottom:1px solid #eee;text-align:left}.doc td:last-child,.doc th:last-child{text-align:right}.doc-total{text-align:right;font-size:22px;font-weight:800;margin-top:20px}.note{background:#fff8e7;border-radius:9px;padding:12px;font-size:13px;color:#735922}.settings{display:flex;gap:14px;flex-wrap:wrap}.settings>div{flex:1;min-width:180px}@media(max-width:780px){.shell{display:block}aside{width:100%;display:flex;overflow-x:auto;padding:8px;position:sticky;top:0;z-index:2}aside button{white-space:nowrap;width:auto;margin:0;padding:12px}main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.card{padding:15px}header{padding:14px}}
@media print{header,aside,.no-print,.top button,.panel:not(.printable){display:none!important}main{padding:0}.shell{display:block}.doc{border:0;box-shadow:none}.printable{border:0;padding:0}}
</style></head><body><header><div class="brand">Clean<span>Cut</span> HQ <span class="tag">BETA 0.1</span></div><div class="muted">Clean & Cut Contracting LLC</div></header><div class="shell"><aside id="nav"></aside><main id="app"></main></div><dialog id="modal"><div class="dialoghead"><h2 id="modalTitle"></h2><button class="btn secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div></dialog><script>
const KEY='cleancut-hq-v01';const initial={clients:[],jobs:[],estimates:[],invoices:[],settings:{business:'Clean & Cut Contracting LLC',accent:'#b91c1c',footer:'Thank you for choosing Clean & Cut Contracting LLC.'}};let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{data=structuredClone(initial)}let page='Dashboard';const tabs=['Dashboard','Planner','Clients','Jobs','Estimates','Invoices','Settings'];const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);const client=id=>data.clients.find(c=>c.id===id);const job=id=>data.jobs.find(j=>j.id===id);const est=id=>data.estimates.find(e=>e.id===id);const inv=id=>data.invoices.find(i=>i.id===id);const val=id=>$(id).value;function show(p){page=p;render()}function render(){document.documentElement.style.setProperty('--accent',data.settings.accent);$('nav').innerHTML=tabs.map(t=>`<button class="${t===page?'active':''}" onclick="show('${t}')">${({Dashboard:'◫',Planner:'▦',Clients:'♙',Jobs:'▣',Estimates:'▤',Invoices:'▧',Settings:'⚙'})[t]} &nbsp; ${t}</button>`).join('');let html='';if(page==='Dashboard'){let today=new Date().toLocaleDateString('en-CA');let pending=data.jobs.filter(j=>j.status==='Completed'&&!data.invoices.some(i=>i.jobId===j.id));html=`<div class="top"><div><h1>Good to see you 👋</h1><p>Your business, all in one place.</p></div><button class="btn" onclick="newJob()">+ New job</button></div><div class="cards">${[['Clients',data.clients.length],['Jobs',data.jobs.length],['Ready to invoice',pending.length],['Outstanding',money(data.invoices.filter(i=>i.status!=='Paid').reduce((s,i)=>s+i.amount,0))]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="metric">${b}</div></div>`).join('')}</div><section class="panel"><h2>Today's plan</h2>${jobRows(data.jobs.filter(j=>j.date===today))||'<div class="empty">Nothing scheduled today. Add a job or use the planner.</div>'}</section><section class="panel"><h2>Completed jobs ready for invoicing</h2>${jobRows(pending)||'<div class="empty">All caught up!</div>'}</section>`}if(page==='Planner'){html=`<div class="top"><div><h1>Flexible daily planner</h1><p>Schedule jobs by day, arrival window, or exact time.</p></div><button class="btn" onclick="newJob()">+ Add job</button></div><section class="panel"><label>Choose day</label><input type="date" id="day" value="${window.plannerDay||new Date().toLocaleDateString('en-CA')}" onchange="window.plannerDay=this.value;render()"><div id="dayJobs">${jobRows(data.jobs.filter(j=>j.date===(window.plannerDay||new Date().toLocaleDateString('en-CA'))))||'<div class="empty">No jobs assigned to this day.</div>'}</div></section><section class="panel"><h2>Unscheduled jobs</h2>${jobRows(data.jobs.filter(j=>!j.date))||'<div class="empty">No unscheduled jobs.</div>'}</section>`}if(page==='Clients'){html=`<div class="top"><div><h1>Clients</h1><p>Customer contact details and properties.</p></div><button class="btn" onclick="newClient()">+ New client</button></div><section class="panel">${data.clients.map(c=>`<div class="item"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.email)} · ${esc(c.phone)} · ${esc(c.address)}</div></div><button class="btn secondary" onclick="newClient('${c.id}')">Edit</button></div>`).join('')||'<div class="empty">Add your first client to get started.</div>'}</section>`}if(page==='Jobs'){html=`<div class="top"><div><h1>Jobs & projects</h1><p>Every job connects to estimates and invoices.</p></div><button class="btn" onclick="newJob()">+ New job</button></div><section class="panel">${jobRows(data.jobs)||'<div class="empty">Create your first job.</div>'}</section>`}if(page==='Estimates'){html=`<div class="top"><div><h1>Estimates</h1><p>Prepare and link quotes to jobs.</p></div><button class="btn" onclick="newEstimate()">+ New estimate</button></div><section class="panel">${data.estimates.map(e=>`<div class="item"><div><b>${esc(e.title)}</b><div class="muted">${esc(client(e.clientId)?.name||'Unknown client')} · ${money(e.amount)} · ${esc(e.status)}</div></div><div class="row"><button class="btn secondary" onclick="newEstimate('${e.id}')">Edit</button><button class="btn secondary" onclick="viewEstimate('${e.id}')">Preview</button></div></div>`).join('')||'<div class="empty">No estimates yet.</div>'}</section>`}if(page==='Invoices'){html=`<div class="top"><div><h1>Invoices</h1><p>Review and customize invoices before sending.</p></div></div><section class="panel">${data.invoices.map(i=>`<div class="item"><div><b>${esc(i.title)}</b><div class="muted">${esc(client(i.clientId)?.name||'Unknown client')} · ${money(i.amount)} · ${esc(i.status)}</div></div><div class="row"><button class="btn secondary" onclick="editInvoice('${i.id}')">Edit</button><button class="btn secondary" onclick="viewInvoice('${i.id}')">Preview / Print</button></div></div>`).join('')||'<div class="empty">Complete a job linked to an estimate, then generate an invoice draft.</div>'}</section>`}if(page==='Settings'){html=`<h1>Business & document settings</h1><p>These settings apply to your estimates and invoices.</p><section class="panel"><div class="settings"><div><label>Business name</label><input id="business" value="${esc(data.settings.business)}"></div><div><label>Brand color</label><input type="color" id="accent" value="${esc(data.settings.accent)}"></div></div><label>Document footer</label><textarea id="footer">${esc(data.settings.footer)}</textarea><button class="btn" onclick="data.settings={business:val('business'),accent:val('accent'),footer:val('footer')};save();render()">Save settings</button></section><section class="panel"><h2>Backup your data</h2><p>Prototype data is stored only in this browser. Export it regularly.</p><div class="row"><button class="btn secondary" onclick="backup()">Download JSON backup</button><button class="btn secondary" onclick="$('restore').click()">Import backup</button><input class="hidden" type="file" id="restore" accept="application/json" onchange="restore(event)"></div></section>`}$('app').innerHTML=html}function jobRows(arr){return arr.map(j=>`<div class="item"><div><b>${esc(j.title)}</b><div class="muted">${esc(client(j.clientId)?.name||'No client')} · ${esc(j.date||'Unscheduled')} ${j.time?'· '+esc(j.time):''}</div></div><div class="row"><span class="pill ${j.status==='Completed'?'good':''}">${esc(j.status)}</span><button class="btn secondary" onclick="jobDetail('${j.id}')">Open →</button></div></div>`).join('')}function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').showModal()}function closeModal(){$('modal').close()}function field(name,id,value='',type='text'){return `<label for="${id}">${name}</label><input id="${id}" type="${type}" value="${esc(value)}">`}function clientOptions(id){return data.clients.map(c=>`<option value="${c.id}" ${c.id===id?'selected':''}>${esc(c.name)}</option>`).join('')}function newClient(id){let c=client(id)||{};modal(id?'Edit client':'New client',`<form onsubmit="saveClient(event,'${id||''}')">${field('Name','cname',c.name)}<div class="formgrid"><div>${field('Email','cemail',c.email,'email')}</div><div>${field('Phone','cphone',c.phone,'tel')}</div></div>${field('Property / billing address','caddress',c.address)}<button class="btn" type="submit">Save client</button></form>`)}function saveClient(ev,id){ev.preventDefault();let obj={id:id||uid(),name:val('cname'),email:val('cemail'),phone:val('cphone'),address:val('caddress')};if(!obj.name.trim())return alert('Client name required');if(id)Object.assign(client(id),obj);else data.clients.push(obj);save();closeModal();render()}function newJob(id){if(!data.clients.length)return alert('Add a client first.');let j=job(id)||{};modal(id?'Edit job':'New job',`<form onsubmit="saveJob(event,'${id||''}')">${field('Job / project name','jtitle',j.title)}<label>Client</label><select id="jclient">${clientOptions(j.clientId)}</select><div class="formgrid"><div>${field('Day (optional)','jdate',j.date,'date')}</div><div><label>Scheduling mode</label><select id="jmode" onchange="$('jtimewrap').classList.toggle('hidden',this.value==='Day only')">${['Day only','Arrival window','Exact time'].map(m=>`<option ${m===(j.mode||'Day only')?'selected':''}>${m}</option>`).join('')}</select></div></div><div id="jtimewrap" class="${!j.mode||j.mode==='Day only'?'hidden':''}">${field('Time or window (e.g. 9–12)','jtime',j.time)}</div><label>Status</label><select id="jstatus">${['Planned','In progress','Completed'].map(s=>`<option ${s===(j.status||'Planned')?'selected':''}>${s}</option>`).join('')}</select><label>Job notes</label><textarea id="jnotes">${esc(j.notes||'')}</textarea><button class="btn" type="submit">Save job</button></form>`)}function saveJob(ev,id){ev.preventDefault();let mode=val('jmode'),obj={id:id||uid(),title:val('jtitle'),clientId:val('jclient'),date:val('jdate'),mode,time:mode==='Day only'?'':val('jtime'),status:val('jstatus'),notes:val('jnotes')};if(!obj.title.trim())return alert('Job title required');if(id)Object.assign(job(id),obj);else data.jobs.push(obj);save();closeModal();render()}function jobDetail(id){let j=job(id),linked=data.estimates.filter(e=>e.jobId===id),invoice=data.invoices.find(i=>i.jobId===id);modal('Job details',`<h2>${esc(j.title)}</h2><p>${esc(client(j.clientId)?.name)} · ${esc(j.date||'Unscheduled')} · ${esc(j.status)}</p><div class="note">${esc(j.notes||'No job notes')}</div><label>Linked estimate</label><div>${linked.map(e=>`<div class="item"><span>${esc(e.title)} — ${money(e.amount)}</span><button class="btn secondary" onclick="viewEstimate('${e.id}')">View</button></div>`).join('')||'<p>No estimate linked yet.</p>'}</div><div class="row" style="margin-top:16px"><button class="btn secondary" onclick="newJob('${id}')">Edit job</button><button class="btn secondary" onclick="newEstimate('', '${id}')">+ Create estimate</button>${j.status!=='Completed'?`<button class="btn" onclick="completeJob('${id}')">Mark completed</button>`:''}${j.status==='Completed'&&linked.length&&!invoice?`<button class="btn" onclick="generateInvoice('${id}')">Generate invoice draft</button>`:''}${invoice?`<button class="btn" onclick="editInvoice('${invoice.id}')">Open invoice</button>`:''}</div>`)}function completeJob(id){job(id).status='Completed';save();closeModal();jobDetail(id)}function newEstimate(id,jobId){if(!data.clients.length)return alert('Add a client first.');let e=est(id)||{},j=job(jobId||e.jobId);modal(id?'Edit estimate':'New estimate',`<form onsubmit="saveEstimate(event,'${id||''}')">${field('Estimate title','etitle',e.title||j?.title||'Cleaning services')}<label>Client</label><select id="eclient" onchange="updateEstimateJobs()">${clientOptions(e.clientId||j?.clientId)}</select><label>Linked job (optional)</label><select id="ejob"></select>${field('Description / line items (one per line)','edesc',e.description||j?.title||'')}<div class="formgrid"><div>${field('Total estimate ($)','eamount',e.amount||'','number')}</div><div><label>Status</label><select id="estatus">${['Draft','Sent','Approved','Declined'].map(s=>`<option ${s===(e.status||'Draft')?'selected':''}>${s}</option>`).join('')}</select></div></div><button class="btn" type="submit">Save estimate</button></form>`);window.selectedJob=jobId||e.jobId||'';updateEstimateJobs()}function updateEstimateJobs(){let id=val('eclient');$('ejob').innerHTML=`<option value="">Not linked</option>`+data.jobs.filter(j=>j.clientId===id).map(j=>`<option value="${j.id}" ${j.id===window.selectedJob?'selected':''}>${esc(j.title)}</option>`).join('')}function saveEstimate(ev,id){ev.preventDefault();let amount=Number(val('eamount'));if(!Number.isFinite(amount)||amount<0)return alert('Enter a valid amount');let obj={id:id||uid(),title:val('etitle'),clientId:val('eclient'),jobId:val('ejob'),description:val('edesc'),amount,status:val('estatus')};if(!obj.title.trim())return alert('Estimate title required');if(id)Object.assign(est(id),obj);else data.estimates.push(obj);save();closeModal();render()}function generateInvoice(jobId){let j=job(jobId);if(j.status!=='Completed')return alert('Complete the job first');if(data.invoices.some(i=>i.jobId===jobId))return alert('An invoice already exists for this job');let e=data.estimates.filter(e=>e.jobId===jobId&&e.status!=='Declined').at(-1);if(!e)return alert('Link an estimate first');let i={id:uid(),jobId,estimateId:e.id,clientId:e.clientId,title:e.title,description:e.description,amount:e.amount,status:'Draft',due:'',notes:''};data.invoices.push(i);save();closeModal();editInvoice(i.id)}function editInvoice(id){let i=inv(id);modal('Review invoice draft',`<div class="note">Nothing is sent automatically. Review the details before sharing.</div><form onsubmit="saveInvoice(event,'${id}')">${field('Invoice title','ititle',i.title)}<label>Services / line items</label><textarea id="idesc">${esc(i.description)}</textarea><div class="formgrid"><div>${field('Invoice total ($)','iamount',i.amount,'number')}</div><div>${field('Due date (optional)','idue',i.due,'date')}</div></div><label>Status</label><select id="istatus">${['Draft','Sent','Paid','Void'].map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}</select><label>Notes</label><textarea id="inotes">${esc(i.notes||'')}</textarea><div class="row"><button class="btn" type="submit">Save changes</button><button class="btn secondary" type="button" onclick="viewInvoice('${id}')">Preview / Print</button></div></form>`)}function saveInvoice(ev,id){ev.preventDefault();let i=inv(id),amount=Number(val('iamount'));if(!Number.isFinite(amount)||amount<0)return alert('Enter a valid amount');Object.assign(i,{title:val('ititle'),description:val('idesc'),amount,due:val('idue'),status:val('istatus'),notes:val('inotes')});save();closeModal();render()}function docHTML(d,kind){let c=client(d.clientId);return `<div class="doc"><h2>${esc(data.settings.business)}</h2><div class="muted">${kind} · ${esc(d.id.slice(0,8).toUpperCase())}</div><h3>${esc(d.title)}</h3><p><b>Bill to:</b> ${esc(c?.name||'')}<br>${esc(c?.address||'')}<br>${esc(c?.email||'')}</p>${d.due?`<p>Due: ${esc(d.due)}</p>`:''}<table><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody><tr><td style="white-space:pre-wrap">${esc(d.description)}</td><td>${money(d.amount)}</td></tr></tbody></table><div class="doc-total">Total: ${money(d.amount)}</div><p>${esc(d.notes||'')}</p><p>${esc(data.settings.footer)}</p></div>`}function viewEstimate(id){let e=est(id);closeModal();show('Estimates');$('app').innerHTML=`<div class="top no-print"><h1>Estimate preview</h1><div class="row"><button class="btn secondary" onclick="render()">Back</button><button class="btn" onclick="window.print()">Print / Save PDF</button></div></div><section class="panel printable">${docHTML(e,'ESTIMATE')}</section>`}function viewInvoice(id){let i=inv(id);closeModal();show('Invoices');$('app').innerHTML=`<div class="top no-print"><h1>Invoice preview</h1><div class="row"><button class="btn secondary" onclick="render()">Back</button><button class="btn" onclick="window.print()">Print / Save PDF</button></div></div><section class="panel printable">${docHTML(i,'INVOICE')}</section><div class="note no-print">To send: print/save as PDF, then attach it to your own email. Automated delivery is not yet connected.</div>`}function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cleancut-hq-backup.json';a.click();URL.revokeObjectURL(url)}async function restore(ev){try{let d=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(d.clients)||!Array.isArray(d.jobs)||!Array.isArray(d.estimates)||!Array.isArray(d.invoices)||!d.settings)throw Error('Invalid backup');if(!confirm('Replace all local prototype data with this backup?'))return;data=d;save();render()}catch(e){alert('Could not import backup: '+e.message)}}render();
</script></body></html>
