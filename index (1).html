<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b91c1c"><title>CleanCut HQ</title><style>

font-weight:650;display:block;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #dce0e7;border-radius:9px;background:#fff;color:#1f2937}textarea{min-height:85px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}.hidden{display:none!important}dialog{border:0;border-radius:18px;padding:25px;width:min(94vw,570px);box-shadow:0 20px 80px #18202d40}dialog::backdrop{background:#141b2a88}.dialoghead{display:flex;justify-content:space-between;align-items:center}.empty{padding:35px;text-align:center;color:#8a94a4;border:1px dashed #d7dce4;border-radius:12px}.doc{background:#fff;border:1px solid #ddd;padding:30px;margin:15px 0;box-shadow:0 4px 14px #00000008}.doc h2{font-size:28px;color:var(--accent,#b91c1c)}.doc table{width:100%;border-collapse:collapse;margin-top:22px}.doc th,.doc td{padding:10px;border-bottom:1px solid #eee;text-align:left}.doc td:last-child,.doc th:last-child{text-align:right}.doc-total{text-align:right;font-size:22px;font-weight:800;margin-top:20px}.note{background:#fff8e7;border-radius:9px;padding:12px;font-size:13px;color:#735922}.settings{display:flex;gap:14px;flex-wrap:wrap}.settings>div{flex:1;min-width:180px}@media(max-width:780px){.shell{display:block}aside{width:100%;display:flex;overflow-x:auto;padding:8px;position:sticky;top:0;z-index:2}aside button{white-space:nowrap;width:auto;margin:0;padding:12px}main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.card{padding:15px}header{padding:14px}}
.doc.layout-classic{border:2px solid #273244}.doc.layout-classic h2{border-bottom:2px solid var(--accent);padding-bottom:14px}.doc.layout-minimal{box-shadow:none;border:0}.doc.layout-minimal h2{font-size:22px}.doc.layout-modern{border-top:5px solid var(--accent)}@media print{header,aside,.no-print,.top button,.panel:not(.printable){display:none!important}main{padding:0}.shell{display:block}.doc{border:0;box-shadow:none}.printable{border:0;padding:0}}

:root{background:#f3f5f8;color:#182333}main{margin:0 auto;max-width:1500px}aside{background:#182333;border:0}aside button{color:#cbd5e1}aside button.active{background:#354155;color:white}header{position:sticky;top:0;z-index:3}.panel,.card{border-radius:12px;box-shadow:0 2px 5px #17233308}.editorgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}.editorgrid .panel{margin-top:16px}.linebox{border:1px solid #dce2ea;border-radius:10px;padding:14px;margin-bottom:12px;background:#fafbfd}.linegrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:center}.totals{margin:18px 0 0 auto;max-width:310px}.totals>div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e4e8ee}.totals>div:last-child{font-size:1.15em;border-bottom:0}.dochead{display:flex;justify-content:space-between;gap:12px;align-items:start}.dochead strong{color:var(--accent)}.doc{overflow-wrap:anywhere}.doc table{font-size:12px}.doc .pre{white-space:pre-wrap}.doc.layout-classic .dochead{border-bottom:2px solid var(--accent);padding-bottom:12px}.doc.layout-minimal .dochead{border:0}.doc.layout-modern .dochead{border-top:5px solid var(--accent);padding-top:12px}button:disabled{opacity:.45;cursor:not-allowed}input:focus,textarea:focus,select:focus{outline:2px solid #9aaec8;outline-offset:1px}@media(max-width:1000px){.editorgrid{grid-template-columns:1fr}}@media(max-width:650px){main{padding:14px}.linegrid{gap:6px}.doc{padding:12px!important}.doc table th,.doc table td{padding:5px!important}}@media print{body:has(#liveDoc) *{visibility:hidden}body:has(#liveDoc) #liveDoc,body:has(#liveDoc) #liveDoc *{visibility:visible}body:has(#liveDoc) #liveDoc{position:absolute;left:0;top:0;width:100%}}
</style></head><body><header><div class="brand">Clean<span>Cut</span> HQ <span class="tag">BETA 0.2</span></div><div class="muted">Clean & Cut Contracting LLC</div></header><div class="shell"><aside id="nav"></aside><main id="app"></main></div><dialog id="modal"><div class="dialoghead"><h2 id="modalTitle"></h2><button class="btn secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div></dialog><script>
const KEY='cleancut-hq-v01';const initial={clients:[],jobs:[],estimates:[],invoices:[],settings:{business:'Clean & Cut Contracting LLC',accent:'#b91c1c',footer:'Thank you for choosing Clean & Cut Contracting LLC.',template:'modern',font:'system-ui',showAddress:true,showEmail:true,terms:'Payment due upon receipt.',logo:''}};let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{data=structuredClone(initial)}let page='Dashboard';const tabs=['Dashboard','Planner','Clients','Jobs','Estimates','Invoices','Cloud','Settings'];const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);const client=id=>data.clients.find(c=>c.id===id);const job=id=>data.jobs.find(j=>j.id===id);const est=id=>data.estimates.find(e=>e.id===id);const inv=id=>data.invoices.find(i=>i.id===id);const val=id=>$(id).value;function show(p){page=p;render()}function render(){document.documentElement.style.setProperty('--accent',data.settings.accent);$('nav').innerHTML=tabs.map(t=>`<button class="${t===page?'active':''}" onclick="show('${t}')">${({Dashboard:'◫',Planner:'▦',Clients:'♙',Jobs:'▣',Estimates:'▤',Invoices:'▧',Designer:'✎',Cloud:'☁',Settings:'⚙'})[t]} &nbsp; ${t}</button>`).join('');let html='';if(page==='Dashboard'){let today=new Date().toLocaleDateString('en-CA');let pending=data.jobs.filter(j=>j.status==='Completed'&&!data.invoices.some(i=>i.jobId===j.id));html=`<div class="top"><div><h1>Good to see you 👋</h1><p>Your business, all in one place.</p></div><button class="btn" onclick="newJob()">+ New job</button></div><div class="cards">${[['Clients',data.clients.length],['Jobs',data.jobs.length],['Ready to invoice',pending.length],['Outstanding',money(data.invoices.filter(i=>i.status!=='Paid').reduce((s,i)=>s+i.amount,0))]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="metric">${b}</div></div>`).join('')}</div><section class="panel"><h2>Today's plan</h2>${jobRows(data.jobs.filter(j=>j.date===today))||'<div class="empty">Nothing scheduled today. Add a job or use the planner.</div>'}</section><section class="panel"><h2>Completed jobs ready for invoicing</h2>${jobRows(pending)||'<div class="empty">All caught up!</div>'}</section>`}if(page==='Planner'){html=`<div class="top"><div><h1>Flexible daily planner</h1><p>Schedule jobs by day, arrival window, or exact time.</p></div><button class="btn" onclick="newJob()">+ Add job</button></div><section class="panel"><label>Choose day</label><input type="date" id="day" value="${window.plannerDay||new Date().toLocaleDateString('en-CA')}" onchange="window.plannerDay=this.value;render()"><div id="dayJobs">${jobRows(data.jobs.filter(j=>j.date===(window.plannerDay||new Date().toLocaleDateString('en-CA'))))||'<div class="empty">No jobs assigned to this day.</div>'}</div></section><section class="panel"><h2>Unscheduled jobs</h2>${jobRows(data.jobs.filter(j=>!j.date))||'<div class="empty">No unscheduled jobs.</div>'}</section>`}if(page==='Clients'){html=`<div class="top"><div><h1>Clients</h1><p>Customer contact details and properties.</p></div><button class="btn" onclick="newClient()">+ New client</button></div><section class="panel">${data.clients.map(c=>`<div class="item"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.email)} · ${esc(c.phone)} · ${esc(c.address)}</div></div><button class="btn secondary" onclick="newClient('${c.id}')">Edit</button></div>`).join('')||'<div class="empty">Add your first client to get started.</div>'}</section>`}if(page==='Jobs'){html=`<div class="top"><div><h1>Jobs & projects</h1><p>Every job connects to estimates and invoices.</p></div><button class="btn" onclick="newJob()">+ New job</button></div><section class="panel">${jobRows(data.jobs)||'<div class="empty">Create your first job.</div>'}</section>`}if(page==='Estimates'){html=`<div class="top"><div><h1>Estimates</h1><p>Prepare and link quotes to jobs.</p></div><button class="btn" onclick="newEstimate()">+ New estimate</button></div><section class="panel">${data.estimates.map(e=>`<div class="item"><div><b>${esc(e.title)}</b><div class="muted">${esc(client(e.clientId)?.name||'Unknown client')} · ${money(e.amount)} · ${esc(e.status)}</div></div><div class="row"><button class="btn secondary" onclick="newEstimate('${e.id}')">Edit</button><button class="btn secondary" onclick="viewEstimate('${e.id}')">Preview</button></div></div>`).join('')||'<div class="empty">No estimates yet.</div>'}</section>`}if(page==='Invoices'){html=`<div class="top"><div><h1>Invoices</h1><p>Review and customize invoices before sending.</p></div><button class="btn" onclick="editInvoice()">+ New invoice</button></div><section class="panel">${data.invoices.map(i=>`<div class="item"><div><b>${esc(i.title)}</b><div class="muted">${esc(client(i.clientId)?.name||'Unknown client')} · ${money(i.amount)} · ${esc(i.status)}</div></div><div class="row"><button class="btn secondary" onclick="editInvoice('${i.id}')">Edit</button><button class="btn secondary" onclick="viewInvoice('${i.id}')">Preview / Print</button></div></div>`).join('')||'<div class="empty">Complete a job linked to an estimate, then generate an invoice draft.</div>'}</section>`}if(page==='Designer'){let st=data.settings;html=`<div class="top"><div><h1>Document designer</h1><p>Customize the appearance of invoices and estimates. Changes apply to future previews.</p></div></div><section class="panel"><div class="formgrid"><div><label>Layout</label><select id="dtemplate"><option value="modern" ${st.template==='modern'?'selected':''}>Modern</option><option value="classic" ${st.template==='classic'?'selected':''}>Classic</option><option value="minimal" ${st.template==='minimal'?'selected':''}>Minimal</option></select></div><div><label>Font</label><select id="dfont"><option value="system-ui" ${st.font==='system-ui'?'selected':''}>Modern sans-serif</option><option value="Georgia,serif" ${st.font==='Georgia,serif'?'selected':''}>Elegant serif</option><option value="Arial,sans-serif" ${st.font==='Arial,sans-serif'?'selected':''}>Arial</option></select></div><div><label>Accent color</label><input id="daccent" type="color" value="${esc(st.accent)}"></div><div><label>Logo image URL (HTTPS)</label><input id="dlogo" value="${esc(st.logo||'')}" placeholder="https://..."></div></div><label><input type="checkbox" id="daddress" style="width:auto" ${st.showAddress!==false?'checked':''}> Show billing address</label><label><input type="checkbox" id="demail" style="width:auto" ${st.showEmail!==false?'checked':''}> Show customer email</label><label>Payment terms</label><textarea id="dterms">${esc(st.terms||'')}</textarea><label>Footer message</label><textarea id="dfooter">${esc(st.footer||'')}</textarea><button class="btn" onclick="saveDesign()">Save document design</button></section><section class="panel"><h2>Live example preview</h2><div id="designPreview">${docHTML({id:'SAMPLE01',title:'Sample cleaning service',clientId:'',description:'Deep cleaning · 1 visit',amount:285,due:'',notes:''},'INVOICE')}</div></section>`}if(page==='Cloud'){html=`<div class="top"><div><h1>Cloud sync</h1><p>Optional Supabase account connection. Set up your own project first.</p></div></div><section class="panel"><div class="note">GitHub Pages is public hosting. Never paste a Supabase secret/service-role key here. Use only the public publishable key, and install the included database security policies first.</div><label>Supabase project URL</label><input id="sburl" placeholder="https://your-project.supabase.co" value="${esc(cloudConfig.url)}"><label>Supabase publishable key</label><input id="sbkey" placeholder="sb_publishable_..." value="${esc(cloudConfig.key)}"><button class="btn secondary" onclick="configureCloud()">Connect project</button><div id="cloudAuth">${cloudClient?'<p>Project connected. Sign in to sync.</p>':'<p>Not configured yet. Local app still works.</p>'}</div><div class="row" style="margin-top:16px"><button class="btn secondary" onclick="cloudSignIn()">Sign in / Sign up</button><button class="btn secondary" onclick="cloudLoad()">Load cloud data</button><button class="btn" onclick="cloudSave()">Upload local data</button><button class="btn secondary" onclick="cloudSignOut()">Sign out</button></div><p class="muted" id="cloudStatus">${esc(cloudMessage)}</p></section>`}
if(page==='Settings'){html=settingsHTML()}$('app').innerHTML=html}function jobRows(arr){return arr.map(j=>`<div class="item"><div><b>${esc(j.title)}</b><div class="muted">${esc(client(j.clientId)?.name||'No client')} · ${esc(j.date||'Unscheduled')} ${j.time?'· '+esc(j.time):''}</div></div><div class="row"><span class="pill ${j.status==='Completed'?'good':''}">${esc(j.status)}</span><button class="btn secondary" onclick="jobDetail('${j.id}')">Open →</button></div></div>`).join('')}function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;if(!$('modal').open)$('modal').showModal()}function closeModal(){$('modal').close()}function field(name,id,value='',type='text'){return `<label for="${id}">${name}</label><input id="${id}" type="${type}" value="${esc(value)}">`}function clientOptions(id){return data.clients.map(c=>`<option value="${c.id}" ${c.id===id?'selected':''}>${esc(c.name)}</option>`).join('')}function newClient(id){let c=client(id)||{};modal(id?'Edit client':'New client',`<form onsubmit="saveClient(event,'${id||''}')">${field('Name','cname',c.name)}<div class="formgrid"><div>${field('Email','cemail',c.email,'email')}</div><div>${field('Phone','cphone',c.phone,'tel')}</div></div>${field('Property / billing address','caddress',c.address)}<button class="btn" type="submit">Save client</button></form>`)}function saveClient(ev,id){ev.preventDefault();let obj={id:id||uid(),name:val('cname'),email:val('cemail'),phone:val('cphone'),address:val('caddress')};if(!obj.name.trim())return alert('Client name required');if(id)Object.assign(client(id),obj);else data.clients.push(obj);save();closeModal();render()}function newJob(id){if(!data.clients.length)return alert('Add a client first.');let j=job(id)||{};modal(id?'Edit job':'New job',`<form onsubmit="saveJob(event,'${id||''}')">${field('Job / project name','jtitle',j.title)}<label>Client</label><select id="jclient">${clientOptions(j.clientId)}</select><div class="formgrid"><div>${field('Day (optional)','jdate',j.date,'date')}</div><div><label>Scheduling mode</label><select id="jmode" onchange="$('jtimewrap').classList.toggle('hidden',this.value==='Day only')">${['Day only','Arrival window','Exact time'].map(m=>`<option ${m===(j.mode||'Day only')?'selected':''}>${m}</option>`).join('')}</select></div></div><div id="jtimewrap" class="${!j.mode||j.mode==='Day only'?'hidden':''}">${field('Time or window (e.g. 9–12)','jtime',j.time)}</div><label>Status</label><select id="jstatus">${['Planned','In progress','Completed'].map(s=>`<option ${s===(j.status||'Planned')?'selected':''}>${s}</option>`).join('')}</select><label>Job notes</label><textarea id="jnotes">${esc(j.notes||'')}</textarea><button class="btn" type="submit">Save job</button></form>`)}function saveJob(ev,id){ev.preventDefault();let mode=val('jmode'),obj={id:id||uid(),title:val('jtitle'),clientId:val('jclient'),date:val('jdate'),mode,time:mode==='Day only'?'':val('jtime'),status:val('jstatus'),notes:val('jnotes')};if(!obj.title.trim())return alert('Job title required');if(id)Object.assign(job(id),obj);else data.jobs.push(obj);save();closeModal();render()}function jobDetail(id){let j=job(id),linked=data.estimates.filter(e=>e.jobId===id),invoice=data.invoices.find(i=>i.jobId===id);modal('Job details',`<h2>${esc(j.title)}</h2><p>${esc(client(j.clientId)?.name)} · ${esc(j.date||'Unscheduled')} · ${esc(j.status)}</p><div class="note">${esc(j.notes||'No job notes')}</div><label>Linked estimate</label><div>${linked.map(e=>`<div class="item"><span>${esc(e.title)} — ${money(e.amount)}</span><button class="btn secondary" onclick="viewEstimate('${e.id}')">View</button></div>`).join('')||'<p>No estimate linked yet.</p>'}</div><div class="row" style="margin-top:16px"><button class="btn secondary" onclick="newJob('${id}')">Edit job</button><button class="btn secondary" onclick="newEstimate('', '${id}')">+ Create estimate</button>${j.status!=='Completed'?`<button class="btn" onclick="completeJob('${id}')">Mark completed</button>`:''}${j.status==='Completed'&&linked.length&&!invoice?`<button class="btn" onclick="generateInvoice('${id}')">Generate invoice draft</button>`:''}${invoice?`<button class="btn" onclick="editInvoice('${invoice.id}')">Open invoice</button>`:''}</div>`)}function completeJob(id){job(id).status='Completed';save();closeModal();jobDetail(id)}function newEstimate(id,jobId){openEditor('estimate',id,jobId)}
function editInvoice(id){openEditor('invoice',id)}
function generateInvoice(jobId){let j=job(jobId);if(j.status!=='Completed')return alert('Complete the job first');if(data.invoices.some(i=>i.jobId===jobId))return alert('An invoice already exists');let es=data.estimates.filter(e=>e.jobId===jobId&&e.status!=='Declined');let e=es.findLast(e=>e.status==='Approved')||es.at(-1);if(!e)return alert('Link an estimate first');openEditor('invoice',null,jobId,e)}
const defaults=()=>({...initial.settings,notes:'',estimateNotes:'',estimateTerms:'',tax:0,discount:0,dueDays:30,email:'',phone:'',address:'',invoicePrefix:'INV',estimatePrefix:'EST',...data.settings});
const opt=(values,current)=>values.map(([v,t])=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(t)}</option>`).join('');
const round=n=>Math.round((n+Number.EPSILON)*100)/100;
function totals(d){let subtotal=round(d.items.reduce((s,i)=>s+round(Number(i.qty)*Number(i.rate)),0));let discount=round(subtotal*Math.min(100,Math.max(0,Number(d.discount)||0))/100);let tax=round((subtotal-discount)*Math.max(0,Number(d.tax)||0)/100);return {subtotal,discount,tax,total:round(subtotal-discount+tax)}}
function normalize(d,kind){let st=defaults();return {...d,items:d.items||[{name:d.description||'',qty:1,rate:Number(d.amount)||0}],notes:d.notes??(kind==='estimate'?st.estimateNotes:st.notes),terms:d.terms??(kind==='estimate'?st.estimateTerms:st.terms),tax:d.tax??0,discount:d.discount??0,design:{...st,...d.design}}}
let draft,kind;
function openEditor(k,id,jobId,source){if(!data.clients.length)return alert('Add a client first.');kind=k;let old=k==='estimate'?est(id):inv(id),j=job(jobId),st=defaults();let base=old||{title:source?.title||j?.title||'',clientId:source?.clientId||j?.clientId||data.clients[0].id,jobId:jobId||'',status:'Draft',items:source?structuredClone(normalize(source,'estimate').items):[{name:j?.title||'',qty:1,rate:0}],tax:source?.tax??st.tax,discount:source?.discount??st.discount,estimateId:source?.id,notes:k==='estimate'?st.estimateNotes:st.notes,terms:k==='estimate'?st.estimateTerms:st.terms,design:source?.design||st};draft=normalize(base,k);draft.id=id||uid();draft.isNew=!old;draft.number=old?.number||`${k==='estimate'?st.estimatePrefix:st.invoicePrefix}-${draft.id.slice(0,8).toUpperCase()}`;draft.date=old?.date||new Date().toLocaleDateString('en-CA');draft.due=old?.due||'';closeModal();show(k==='estimate'?'Estimates':'Invoices');editorRender()}
function editorRender(){let d=draft; $('app').innerHTML=`<div class="top"><div><div class="muted">${kind==='estimate'?'Estimates':'Invoices'} / ${esc(d.number)}</div><h1>${d.isNew?'Create':'Edit'} ${kind}</h1><p>Build, customize and review in one place.</p></div><div class="row"><button class="btn secondary" onclick="if(confirm('Discard unsaved changes?'))render()">Cancel</button><button class="btn" onclick="commitDoc()">Save ${kind}</button></div></div><div class="editorgrid"><div><section class="panel"><h2>Document details</h2><div class="formgrid"><div>${field('Title','xTitle',d.title)}</div><div>${field('Document number','xNumber',d.number)}</div><div><label>Customer</label><select id="xClient">${clientOptions(d.clientId)}</select></div><div><label>Linked job</label><select id="xJob"></select></div><div>${field('Issue date','xDate',d.date,'date')}</div><div>${field(kind==='estimate'?'Valid until':'Due date','xDue',d.due,'date')}</div></div><label>Status</label><select id="xStatus">${opt((kind==='estimate'?['Draft','Sent','Approved','Declined']:['Draft','Sent','Paid','Void']).map(x=>[x,x]),d.status)}</select></section><section class="panel"><h2>Line items</h2><div id="lines"></div><button class="btn outline" onclick="readDraft();draft.items.push({name:'',qty:1,rate:0});drawLines();refreshPreview()">+ Add line item</button><div class="formgrid"><div>${field('Discount (%)','xDiscount',d.discount,'number')}</div><div>${field('Tax (%)','xTax',d.tax,'number')}</div></div><div id="summary"></div></section><section class="panel"><h2>Customer communication</h2><label>Notes</label><textarea id="xNotes">${esc(d.notes)}</textarea><label>Terms and conditions</label><textarea id="xTerms">${esc(d.terms)}</textarea><label><input type="checkbox" id="xDefaults" style="width:auto"> Save notes and terms as defaults for future ${kind}s</label></section></div><div><section class="panel"><h2>Customize appearance</h2>${designFields(d.design,'x')}<label><input type="checkbox" id="xDesignDefault" style="width:auto"> Save appearance as default</label></section><section class="panel"><div class="top"><h2>Live preview</h2><button class="btn secondary" onclick="printDraft()">Print / PDF</button></div><div id="liveDoc"></div></section></div></div>`;drawLines();jobChoices(d.jobId);$('xClient').addEventListener('change',()=>{jobChoices('');refreshPreview()});$('app').addEventListener('input',editorInput);refreshPreview()}
function editorInput(){if($('xTitle'))refreshPreview()}
function jobChoices(id){$('xJob').innerHTML='<option value="">Not linked</option>'+data.jobs.filter(j=>j.clientId===val('xClient')).map(j=>`<option value="${esc(j.id)}" ${j.id===id?'selected':''}>${esc(j.title)}</option>`).join('')}
function drawLines(){$('lines').innerHTML=draft.items.map((i,n)=>`<div class="linebox"><div class="top"><b>Item ${n+1}</b><button class="btn secondary" onclick="removeLine(${n})" ${draft.items.length===1?'disabled':''}>Remove</button></div><label for="ln${n}">Service / description</label><textarea id="ln${n}">${esc(i.name)}</textarea><div class="linegrid"><div>${field('Quantity','lq'+n,i.qty,'number')}</div><div>${field('Rate ($)','lr'+n,i.rate,'number')}</div><div><label>Amount</label><strong id="la${n}"></strong></div></div></div>`).join('')}
function removeLine(n){readDraft();if(draft.items.length>1)draft.items.splice(n,1);drawLines();refreshPreview()}
function designFields(st,p){return `<label>Layout</label><select id="${p}template">${opt([['modern','Modern'],['classic','Classic'],['minimal','Minimal']],st.template)}</select><label>Typeface</label><select id="${p}font">${opt([['system-ui','Modern sans-serif'],['Georgia,serif','Elegant serif'],['Arial,sans-serif','Arial']],st.font)}</select>${field('Accent color',p+'accent',st.accent,'color')}${field('Logo URL (HTTPS)',p+'logo',st.logo)}<label><input type="checkbox" style="width:auto" id="${p}address" ${st.showAddress!==false?'checked':''}> Show billing address</label><label><input type="checkbox" style="width:auto" id="${p}email" ${st.showEmail!==false?'checked':''}> Show customer email</label><label>Footer</label><textarea id="${p}footer">${esc(st.footer)}</textarea>`}
function readDesign(p){return {template:val(p+'template'),font:val(p+'font'),accent:val(p+'accent'),logo:val(p+'logo'),showAddress:$(p+'address').checked,showEmail:$(p+'email').checked,footer:val(p+'footer')}}
function readDraft(){Object.assign(draft,{title:val('xTitle'),number:val('xNumber'),clientId:val('xClient'),jobId:val('xJob'),date:val('xDate'),due:val('xDue'),status:val('xStatus'),notes:val('xNotes'),terms:val('xTerms'),discount:Number(val('xDiscount')),tax:Number(val('xTax')),design:{...draft.design,...readDesign('x')},items:draft.items.map((i,n)=>({name:val('ln'+n),qty:Number(val('lq'+n)),rate:Number(val('lr'+n))}))});draft.amount=totals(draft).total;draft.description=draft.items.map(i=>i.name).join('\n')}
function refreshPreview(){readDraft();let t=totals(draft);draft.items.forEach((i,n)=>$('la'+n).textContent=money(i.qty*i.rate));$('summary').innerHTML=summaryHTML(t);$('liveDoc').innerHTML=docHTML(draft,kind.toUpperCase())}
function summaryHTML(t){return `<div class="totals">${[['Subtotal',t.subtotal],['Discount',-t.discount],['Tax',t.tax],['Total',t.total]].map(([k,v])=>`<div><span>${k}</span><b>${money(v)}</b></div>`).join('')}</div>`}
function commitDoc(){readDraft();let d=draft;if(!d.title.trim()||!d.number.trim()||d.items.some(i=>!i.name.trim()||!Number.isFinite(i.qty)||i.qty<=0||!Number.isFinite(i.rate)||i.rate<0)||d.discount<0||d.discount>100||d.tax<0||d.tax>100)return alert('Enter a title, number and valid line items, discount and tax.');let arr=kind==='estimate'?data.estimates:data.invoices;if(arr.some(x=>x.id!==d.id&&x.number===d.number))return alert('Document number already exists');if(kind==='invoice'&&d.jobId&&arr.some(x=>x.id!==d.id&&x.jobId===d.jobId))return alert('An invoice already exists for this job');if($('xDefaults').checked){data.settings[kind==='estimate'?'estimateNotes':'notes']=d.notes;data.settings[kind==='estimate'?'estimateTerms':'terms']=d.terms}if($('xDesignDefault').checked)Object.assign(data.settings,readDesign('x'));let copy=structuredClone(d);delete copy.isNew;let idx=arr.findIndex(x=>x.id===d.id);if(idx<0)arr.push(copy);else arr[idx]=copy;save();render()}
function printDraft(){refreshPreview();window.print()}
function docHTML(raw,k){let d=normalize(raw,k.toLowerCase()),st=d.design,c=client(d.clientId),t=totals(d),color=/^#[0-9a-f]{6}$/i.test(st.accent)?st.accent:'#b91c1c',font=['system-ui','Georgia,serif','Arial,sans-serif'].includes(st.font)?st.font:'system-ui';return `<div class="doc layout-${esc(st.template)}" style="font-family:${font};--accent:${color}"><div class="dochead"><div>${st.logo&&/^https:\/\//i.test(st.logo)?`<img src="${esc(st.logo)}" alt="Logo" style="max-width:130px;max-height:65px">`:''}<h2>${esc(st.business)}</h2><div class="muted">${esc(st.email||'')} ${esc(st.phone||'')}</div><div>${esc(st.address||'')}</div></div><div><strong>${esc(k)}</strong><div>${esc(d.number||d.id.slice(0,8).toUpperCase())}</div></div></div><h3>${esc(d.title)}</h3><p><b>Bill to:</b> ${esc(c?.name||'')}${st.showAddress!==false?'<br>'+esc(c?.address||''):''}${st.showEmail!==false?'<br>'+esc(c?.email||''):''}</p><p>${esc(d.date||'')} ${d.due?' · '+esc(d.due):''}</p><table><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${d.items.map(i=>`<tr><td style="white-space:pre-wrap">${esc(i.name)}</td><td>${esc(i.qty)}</td><td>${money(i.rate)}</td><td>${money(i.qty*i.rate)}</td></tr>`).join('')}</tbody></table>${summaryHTML(t)}${d.notes?`<h4>Notes</h4><p class="pre">${esc(d.notes)}</p>`:''}${d.terms?`<h4>Terms and conditions</h4><p class="pre">${esc(d.terms)}</p>`:''}<p class="pre">${esc(st.footer)}</p></div>`}
function settingsHTML(){let st=defaults();return `<div class="top"><div><h1>Settings</h1><p>Manage your business and document preferences.</p></div><button class="btn" onclick="saveSettings()">Save settings</button></div><div class="editorgrid"><div><section class="panel"><h2>Business profile</h2>${field('Business name','sbusiness',st.business)}${field('Email','semail',st.email,'email')}${field('Phone','sphone',st.phone)}${field('Address','saddressBusiness',st.address)}</section><section class="panel"><h2>Billing defaults</h2>${field('Invoice prefix','sinvoicePrefix',st.invoicePrefix)}${field('Estimate prefix','sestimatePrefix',st.estimatePrefix)}${field('Default tax (%)','stax',st.tax,'number')}${field('Default discount (%)','sdiscount',st.discount,'number')}</section><section class="panel"><h2>Default messages</h2>${[['Invoice notes','notes'],['Invoice terms','terms'],['Estimate notes','estimateNotes'],['Estimate terms','estimateTerms']].map(([l,k])=>`<label>${l}</label><textarea id="s${k}">${esc(st[k])}</textarea>`).join('')}</section></div><div><section class="panel"><h2>Document appearance</h2>${designFields(st,'s')}</section><section class="panel"><h2>Data & backup</h2><p>Local data is stored in this browser. Cloud snapshots are manual.</p><div class="row"><button class="btn secondary" onclick="backup()">Export backup</button><button class="btn secondary" onclick="$('restore').click()">Import backup</button><button class="btn secondary" onclick="show('Cloud')">Cloud settings</button></div><input class="hidden" type="file" id="restore" accept="application/json" onchange="restore(event)"></section></div></div>`}
function saveSettings(){let tax=Number(val('stax')),discount=Number(val('sdiscount'));if(tax<0||tax>100||discount<0||discount>100)return alert('Tax and discount must be between 0 and 100');Object.assign(data.settings,readDesign('s'),{business:val('sbusiness'),email:val('semail'),phone:val('sphone'),address:val('saddressBusiness'),invoicePrefix:val('sinvoicePrefix'),estimatePrefix:val('sestimatePrefix'),tax,discount,notes:val('snotes'),terms:val('sterms'),estimateNotes:val('sestimateNotes'),estimateTerms:val('sestimateTerms')});save();render();alert('Settings saved')}
function viewEstimate(id){let e=est(id);closeModal();show('Estimates');$('app').innerHTML=`<div class="top no-print"><h1>Estimate preview</h1><div class="row"><button class="btn secondary" onclick="render()">Back</button><button class="btn" onclick="window.print()">Print / Save PDF</button></div></div><section class="panel printable">${docHTML(e,'ESTIMATE')}</section>`}function viewInvoice(id){let i=inv(id);closeModal();show('Invoices');$('app').innerHTML=`<div class="top no-print"><h1>Invoice preview</h1><div class="row"><button class="btn secondary" onclick="render()">Back</button><button class="btn" onclick="window.print()">Print / Save PDF</button></div></div><section class="panel printable">${docHTML(i,'INVOICE')}</section><div class="note no-print">To send: print/save as PDF, then attach it to your own email. Automated delivery is not yet connected.</div>`}function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cleancut-hq-backup.json';a.click();URL.revokeObjectURL(url)}async function restore(ev){try{let d=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(d.clients)||!Array.isArray(d.jobs)||!Array.isArray(d.estimates)||!Array.isArray(d.invoices)||!d.settings)throw Error('Invalid backup');if(!confirm('Replace all local prototype data with this backup?'))return;data=d;save();render()}catch(e){alert('Could not import backup: '+e.message)}}
function saveDesign(){const logo=val('dlogo').trim();if(logo&&!/^https:\/\//i.test(logo))return alert('Logo must be an HTTPS image URL');Object.assign(data.settings,{template:val('dtemplate'),font:val('dfont'),accent:val('daccent'),logo,showAddress:$('daddress').checked,showEmail:$('demail').checked,terms:val('dterms'),footer:val('dfooter')});save();render()}
let cloudConfig={url:'',key:''},cloudClient=null,cloudMessage='No cloud connection.';
async function configureCloud(){const url=val('sburl').trim(),key=val('sbkey').trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url)||!key.startsWith('sb_publishable_'))return alert('Enter your Supabase project URL and a public publishable key (not a secret key).');try{const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.57.0');cloudClient=createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});cloudConfig={url,key};cloudMessage='Project connected in this tab. Sign in to continue.';render()}catch(e){alert('Unable to connect: '+e.message)}}
async function cloudUser(){if(!cloudClient)throw Error('Connect a Supabase project first.');const {data:res,error}=await cloudClient.auth.getUser();if(error||!res.user)throw Error('Please sign in first.');return res.user}
async function cloudSignIn(){try{if(!cloudClient)throw Error('Connect a Supabase project first.');let email=prompt('Email address for your account:');if(!email)return;let password=prompt('Password (at least 8 characters):');if(!password)return;let result=await cloudClient.auth.signInWithPassword({email,password});if(result.error){if(confirm('Sign in failed. Create a new account with this email and password?'))result=await cloudClient.auth.signUp({email,password});}if(result.error)throw result.error;cloudMessage=result.data.session?'Signed in. You can now upload or load your data.':'Account created. Confirm your email before signing in.';render()}catch(e){alert(e.message)}}
async function cloudSave(){try{let user=await cloudUser();if(!confirm('Upload this browser’s data to your cloud account? This replaces the current cloud snapshot for your account.'))return;let {error}=await cloudClient.from('workspace_snapshots').upsert({user_id:user.id,payload:data,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;cloudMessage='Cloud snapshot saved successfully.';render()}catch(e){alert('Cloud upload failed: '+e.message)}}
async function cloudLoad(){try{let user=await cloudUser();let {data:record,error}=await cloudClient.from('workspace_snapshots').select('payload').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!record)return alert('No cloud snapshot found. Upload your local data first.');let d=record.payload;if(!Array.isArray(d.clients)||!Array.isArray(d.jobs)||!Array.isArray(d.estimates)||!Array.isArray(d.invoices))throw Error('Invalid cloud data');if(!confirm('Replace this browser’s local data with your cloud snapshot? Export a backup first if needed.'))return;data=d;save();cloudMessage='Cloud snapshot loaded.';render()}catch(e){alert('Cloud load failed: '+e.message)}}
async function cloudSignOut(){try{if(cloudClient)await cloudClient.auth.signOut();cloudMessage='Signed out.';render()}catch(e){alert(e.message)}}
render();
</script></body></html>
